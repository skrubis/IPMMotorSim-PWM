# power_stages.yaml
schema_version: 1
units:
  voltage: V
  current: A
  energy_switching: mJ
  energy_recovery: mJ
  time: us
  thermal_resistance: K_per_W
  capacitance: uF
  resistance: mOhm
  inductance: nH

loss_model_defaults:
  switching_energy_vdc_exponent_kV: 1.0     # first-pass: E ∝ Vdc
  current_exponent_kI_sw: 1.10             # first-pass: E ∝ I^k (tune later)
  allocate_diode_recovery_to: "turn_on_switch"
  temperature_interp_points_C: [25, 125, 175]
  notes:
    - "Prefer event-based accounting: add Eon/Eoff/Err only at edges, integrate conduction per interval."
    - "For parallel devices: evaluate curves at I_device = I_switch/N, then multiply energies by N."

power_stages:

  - id: tesla_sdu_auirgps4070d0_6p
    display_name: "Tesla/SDU (Model S/X) AUIRGPS4070D0 x6 per switch"
    topology: "3ph_2level"
    per_switch_parallel: 6

    dc_link:
      architecture: "film_single_lumped"
      capacitance_uF: 450
      voltage_rating_V: 430
      esr_mOhm: null
      esl_nH: null
      notes:
        - "Film DC-link capacitor reported on SDU board (Panasonic ~450uF/430V)."
        - "If modeling cap heating later: add Irms_cap and ESR."

    gate_drive:
      vge_on_V: 15.0
      vge_off_V: -8.0
      rg_on_ohm_per_device: 10.0
      rg_off_ohm_per_device: 30.1
      notes:
        - "Per-device gate resistors (turn-on/turn-off) from teardown."

    device:
      kind: "igbt_with_antiparallel_diode"
      part: "AUIRGPS4070D0"
      ratings:
        vces_max_V: 600
        tj_max_C: 175

      conduction:
        # Minimal anchors; replace with digitized Vce/Vf curves if needed.
        igbt_vce_sat_points_V:
          # format: [Ic_A, Tj_C, Vce_typ_V]
          - [120,  25, 1.70]
          - [120, 175, 2.10]
        diode_vf_points_V:
          - [120,  25, 1.60]
          - [120, 175, 1.90]

      switching:
        reference:
          vdc_V: 400
          vge_V: 15
          rg_ohm: 4.7
        igbt_eon_points_mJ:
          # format: [Ic_A, Tj_C, Eon_mJ]
          - [120,  25, 5.70]
          - [120, 175, 6.40]
        igbt_eoff_points_mJ:
          - [120,  25, 4.20]
          - [120, 175, 4.70]
        diode_erec_points_mJ:
          # datasheet commonly quotes Erec in uJ; store as mJ here
          - [120,  25, 1.07]
          - [120, 175, 1.74]

      thermal:
        rth_jc_K_per_W_per_device:
          igbt_max: 0.20
          diode_max: 0.45
        rth_cs_K_per_W:
          typ: 0.24

    modeling_hints:
      parallel_current_split: "equal"
      diode_rr_included_in_eon: false


  - id: tesla_ldu_ikw75n60t_16p
    display_name: "Tesla/LDU (Model S) IKW75N60T x16 per switch + 3x400uF film"
    topology: "3ph_2level"
    per_switch_parallel: 16

    dc_link:
      architecture: "film_distributed_per_leg"
      per_leg_capacitance_uF: 400
      legs: 3
      total_capacitance_uF: 1200
      voltage_rating_V: 450
      esr_mOhm_per_leg: null
      esl_nH_per_leg: null
      notes:
        - "Per your teardown: each leg has 400uF 450V film cap. Model as distributed or lumped (1200uF)."

    gate_drive:
      vge_on_V: 15.0
      vge_off_V: 0.0
      rg_on_ohm_per_device: null
      rg_off_ohm_per_device: null
      notes:
        - "Set Rg once measured; switching energies depend strongly on Rg."

    device:
      kind: "igbt_with_antiparallel_diode"
      part: "IKW75N60T"
      ratings:
        vces_max_V: 600
        ic_dc_A: 75
        tj_max_C: 175

      conduction:
        igbt_vce_sat_points_V:
          # [Ic_A, Tj_C, Vce_typ_V, Vce_max_V?]
          - [75,  25, 1.50, 2.00]
          - [75, 175, 1.90, null]
        diode_vf_points_V:
          - [75,  25, 1.65, 2.00]
          - [75, 175, 1.60, null]

      switching:
        reference:
          vce_V: 400
          vge_on_off_V: "0/15"
          rg_ohm: 5
          tj_C: 175
        flags:
          eon_includes_diode_recovery: true
        # rough starter digitization at Tj=175C; replace with proper digitized curves later
        igbt_eon_curve_mJ_vs_Ic_A:
          - [20, 0.9]
          - [40, 1.5]
          - [60, 2.3]
          - [75, 2.9]
          - [100, 4.3]
          - [120, 5.8]
          - [140, 8.0]
        igbt_eoff_curve_mJ_vs_Ic_A:
          - [20, 0.8]
          - [40, 1.3]
          - [60, 2.0]
          - [75, 2.5]
          - [100, 3.8]
          - [120, 4.8]
          - [140, 6.0]

      thermal:
        rth_jc_K_per_W_per_device:
          igbt_max: 0.35
          diode_max: 0.60
        rth_ja_K_per_W: 40

    modeling_hints:
      parallel_current_split: "equal"
      diode_rr_included_in_eon: true


  - id: vectrix_pm300cla060_ipm_300a_600v_murata_mlcc
    display_name: "Vectrix/PM300CLA060 (IPM brick) + 4x Murata MLCC 80uF 250V"
    topology: "3ph_2level_module"
    per_switch_parallel: 1

    dc_link:
      architecture: "mlcc_local_lumped"
      capacitor_count: 4
      per_cap:
        type: "mlcc_module"
        markings_seen:
          - "Murata 7717471"
          - "Marking 7205432 (other photos)"
        capacitance_uF_nominal: 80
        voltage_rating_V: 250
      total_capacitance_uF_nominal: 320
      dc_bias_derating_factor: null     # set (e.g. 0.4..0.8) if you want effective C at operating Vdc
      esr_mOhm_total: null
      esl_nH_total: null
      notes:
        - "Per your schematic/photos: 4x 80uF 250V MLCC modules on the powerstage."
        - "MLCC effective C can drop a lot with DC bias; add derating if modeling Vdc ripple."

    gate_drive:
      vge_on_V: 15.0
      vge_off_V: 0.0
      deadtime_min_us: 2.0
      pwm_max_kHz: 20

    device:
      kind: "igbt_module_with_diodes"
      part: "PM300CLA060"
      ratings:
        vces_max_V: 600
        ic_continuous_A: 300
        ic_pulse_A: 600
        tj_max_C: 150

      conduction:
        igbt_vce_sat_points_V:
          # [Ic_A, Tj_C, Vce_typ_V, Vce_max_V]
          - [300,  25, 1.60, 2.40]
          - [300, 125, 1.50, 2.00]
        diode_vf_points_V:
          - [300,  25, 2.20, 3.30]

      switching:
        reference:
          vdc_V: 300
          vdrive_V: 15
        # good starter points (digitized/approx from datasheet plots; refine later)
        igbt_eoff_points_mJ:
          # [Ic_A, Tj_C, Eoff_mJ]
          - [100,  25, 1.04]
          - [200,  25, 3.91]
          - [300,  25, 8.33]
          - [100, 125, 2.37]
          - [200, 125, 6.13]
          - [300, 125, 11.44]
        igbt_eon_points_mJ:
          # provisional (plot has discontinuity); replace with proper digitization when you care
          - [100,  25, 3.72]
          - [200,  25, 6.37]
          - [300,  25, 7.80]
          - [100, 125, 4.64]
          - [200, 125, 7.22]
          - [300, 125, 8.80]
        diode_reverse_recovery:
          irr_points_A:
            # [Ic_A, Tj_C, Irr_A]
            - [100,  25, 31.6]
            - [200,  25, 72.5]
            - [300,  25, 82.5]
            - [100, 125, 85.6]
            - [200, 125, 109.4]
            - [300, 125, 128.5]
          trr_points_us:
            # [Ic_A, Tj_C, trr_us]
            - [100,  25, 0.120]
            - [200,  25, 0.115]
            - [300,  25, 0.115]
            - [100, 125, 0.245]
            - [200, 125, 0.195]
            - [300, 125, 0.195]
          approximations:
            qrr_model: "Qrr ~= 0.5*Irr*trr"
            err_model: "Err ~= Vdc*Qrr"

      thermal:
        rth_jc_K_per_W_per_die:
          igbt_max: 0.16
          diode_max: 0.25
        rth_case_to_cooler_K_per_W_module:
          value: 0.023

    modeling_hints:
      diode_rr_included_in_eon: false


  - id: bmw_i3_generic_650v_igbt_module_fs600r07a2e3_proxy
    display_name: "BMW i3 / Generic 650V IGBT module (HybridPACK2 FS600R07A2E3 proxy)"
    topology: "3ph_2level_module"
    per_switch_parallel: 1

    dc_link:
      architecture: "vehicle_packaged_unknown"
      capacitance_uF: null
      voltage_rating_V: null
      notes:
        - "Use stiff Vdc for silicon-loss sweeps; add C/ESR when you start comparing DC-link heating."

    gate_drive:
      vge_on_V: 15.0
      vge_off_V: -15.0

    device:
      kind: "igbt_module_with_diodes"
      part: "FS600R07A2E3"
      ratings:
        vces_max_V: 650
        tj_max_C: 150

      conduction:
        # anchor points at IF/IC=400A (starter; good enough for comparative loss sweeps)
        igbt_vce_sat_points_V:
          - [400,  25, 1.30, 1.60]
          - [400, 125, 1.35, null]
          - [400, 150, 1.40, null]
        diode_vf_points_V:
          - [400,  25, 1.40, 1.75]
          - [400, 125, 1.35, null]
          - [400, 150, 1.30, null]

      switching:
        reference:
          vdc_V: 300
          current_A: 400
          rg_on_ohm: 2.2
          rg_off_ohm: 1.0
        igbt_eon_points_mJ:
          - [400,  25,  9.0]
          - [400, 125, 11.0]
          - [400, 150, 11.5]
        igbt_eoff_points_mJ:
          - [400,  25, 14.0]
          - [400, 125, 17.5]
          - [400, 150, 18.5]
        diode_erec_points_mJ:
          - [400,  25,  3.5]
          - [400, 125,  7.0]
          - [400, 150,  8.5]

      thermal:
        rth_jf_K_per_W:
          igbt: 0.12
          diode: 0.17

    modeling_hints:
      diode_rr_included_in_eon: false
