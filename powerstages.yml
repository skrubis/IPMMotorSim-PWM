schema_version: 1

meta:
  generated_date: "2026-02-05"
  purpose: >
    Power-stage presets for IPMMotorSim / event-level PWM loss estimation.
    Values marked "user-provided" are placeholders until you (or Codex) replace them
    with digitized curves or teardown-confirmed parts.

units:
  voltage: V
  current: A
  resistance: ohm
  energy: mJ
  charge: uC
  capacitance: uF
  inductance: nH
  temperature: C
  thermal_resistance: K_per_W
  time: ns

power_stages:
  # ---------------------------------------------------------------------------
  # TESLA SDU (Model S/X small drive unit) - discrete IGBTs in parallel
  # ---------------------------------------------------------------------------
  - id: tesla_sdu_model_sx_auirgps4070d0_x6
    display_name: "Tesla SDU (S/X) AUIRGPS4070D0 x6 per switch"
    topology: three_phase_2level_discrete
    inverter:
      switches_total: 6
      parallel_devices_per_switch: 6

    device:
      category: igbt_discrete_with_antiparallel_diode
      manufacturer: Infineon
      part_number: AUIRGPS4070D0
      ratings:
        vces_max_v: 600
        ic_nominal_a: 120
        ic_continuous_a:
          tc_25c: 240
          tc_100c: 160
        tj_max_c: 175

      conduction:
        vce_sat:
          # Datasheet point @ IC=120A, VGE=15V
          ic_a: 120
          tj_points:
            - tj_c: 25
              typ_v: 1.7
              max_v: 2.0
            - tj_c: 150
              typ_v: 2.0
            - tj_c: 175
              typ_v: 2.1
        diode_vf:
          if_a: 120
          tj_points:
            - tj_c: 25
              typ_v: 1.8
              max_v: 2.1
            - tj_c: 175
              typ_v: 1.9

      switching:
        energies_mj:
          # Datasheet switching numbers (includes diode recovery per note)
          conditions:
            ic_a: 120
            vcc_v: 400
            vge_v: 15
            rg_ohm: 4.7
            tj_c: 25
          eon_typ: 5.7
          eon_max: 6.7
          eoff_typ: 4.2
          eoff_max: 5.2
          etotal_typ: 9.9
          etotal_max: 11.9

      thermal:
        rth_jc_igbt_k_per_w_max: 0.20
        rth_jc_diode_k_per_w_max: 0.45
        rth_cs_k_per_w_typ: 0.24

    gate_drive:
      vge_on_v: 15
      vge_off_v: -8
      per_device_gate_resistors:
        # From Ohm Ninja SDU teardown: each device has its own resistor
        rg_on_ohm: 10.0
        rg_off_ohm: 30.1
      effective_per_switch_seen_by_driver:
        # Simple parallel math (useful for a first-order gate-current model)
        rg_on_ohm: 1.67   # ~10/6
        rg_off_ohm: 5.02  # ~30.1/6
      notes: "Gate driver IC + booster stage details are in the Ohm Ninja teardown."

    dc_link:
      voltage_class_v: 430
      capacitors:
        - type: film
          manufacturer: Panasonic
          capacitance_uF_each: 450
          voltage_v: 430
          count: null
          notes: "Ohm Ninja identifies Panasonic 450µF/430V film parts; quantity not stated."
      notes: >
        DC-link C matters most for ripple current, bus ripple, and EMI/overshoot;
        it only weakly affects *device* loss math unless you model ripple & spikes.

  # ---------------------------------------------------------------------------
  # TESLA LDU (Model S large drive unit) - user-provided parallel count
  # ---------------------------------------------------------------------------
  - id: tesla_ldu_ikw75n60t_x16
    display_name: "Tesla LDU (Model S) IKW75N60T x16 per switch"
    topology: three_phase_2level_discrete
    inverter:
      switches_total: 6
      parallel_devices_per_switch: 16  # user-provided (teardown observation)

    device:
      category: igbt_discrete_with_antiparallel_diode
      manufacturer: Infineon
      part_number: IKW75N60T
      ratings:
        vces_max_v: 600
        ic_nominal_a: 75
        tj_max_c: 175

      conduction:
        vce_sat:
          ic_a: 75
          vge_v: 15
          tj_points:
            - tj_c: 25
              typ_v: 1.5
              max_v: 2.0
            - tj_c: 175
              typ_v: 1.9
        diode_vf:
          if_a: 75
          vge_v: 0
          tj_points:
            - tj_c: 25
              typ_v: 1.65
              max_v: 2.0
            - tj_c: 175
              typ_v: 1.6

      switching:
        energies_mj:
          # Datasheet "Inductive Load" table
          conditions_common:
            vcc_v: 400
            ic_a: 75
            vge_v: 15
            rg_ohm: 5
          tj_points:
            - tj_c: 25
              eon_mj: 2.0
              eoff_mj: 2.5
              ets_mj: 4.5
              diode:
                trr_ns: 121
                qrr_uC: 2.4
                irrm_a: 38.5
            - tj_c: 175
              eon_mj: 2.9
              eoff_mj: 2.9
              ets_mj: 5.8
              diode:
                trr_ns: 182
                qrr_uC: 5.8
                irrm_a: 56.2

      thermal:
        rth_jc_igbt_k_per_w_max: 0.35
        rth_jc_diode_k_per_w_max: 0.60

    dc_link:
      voltage_class_v: 450
      capacitors:
        - type: film
          voltage_v: 450
          capacitance_uF_each: 400
          count: 3
          notes: "user-provided: ~400µF film per phase leg (distributed)"
      notes: "Distributed DC-link film can reduce commutation loop inductance and local ripple."

  # ---------------------------------------------------------------------------
  # NISSAN LEAF GEN2 inverter - Infineon HybridPACK2 (single-switch module)
  # ---------------------------------------------------------------------------
  - id: nissan_leaf_gen2_fs800r07a2e3
    display_name: "Nissan Leaf Gen2 FS800R07A2E3 + Panasonic 1074µF"
    topology: three_phase_2level_module_or_discrete
    inverter:
      switches_total: 6
      parallel_devices_per_switch: 1
      notes: >
        FS800R07A2E3 is a "single" HybridPACK2 device (one switch with diode).
        Model assumes 6 devices make one 3-phase 2-level inverter.

    device:
      category: igbt_module_single_switch_with_diode
      manufacturer: Infineon
      part_number: FS800R07A2E3
      ratings:
        vces_max_v: 650
        ic_nominal_a: 800
        ic_continuous_a:
          tf_75c: 550
          tf_25c: 700
        tj_max_c: 175

      parasitics:
        module_stray_inductance_nH_typ: 14
        per_switch_lead_resistance_mOhm_typ: 0.80

      conduction:
        vce_sat_typ:
          # Datasheet @ IC=550A
          ic_a: 550
          tj_points:
            - tj_c: 25
              v_v: 1.30
            - tj_c: 125
              v_v: 1.35
            - tj_c: 150
              v_v: 1.40
          vce_sat_max:
            ic_a: 550
            tj_c: 25
            v_v: 1.60
        diode_vf:
          if_a: 550
          tj_points:
            - tj_c: 25
              typ_v: 1.40
              max_v: 1.75
            - tj_c: 125
              typ_v: 1.35
            - tj_c: 150
              typ_v: 1.30

      switching:
        energies_mj:
          # Datasheet @ IC=550A, VCE=300V
          conditions_common:
            ic_a: 550
            vce_v: 300
            vge_v: 15
          tj_points:
            - tj_c: 25
              eon_mj: 10.5
              eoff_mj: 21.0
              diode:
                erec_mj: 4.0
                qrr_uC: 17.0
                irrm_a: 200
            - tj_c: 125
              eon_mj: 12.0
              eoff_mj: 25.0
              diode:
                erec_mj: 9.5
                qrr_uC: 40.0
                irrm_a: 330
            - tj_c: 150
              eon_mj: 12.5
              eoff_mj: 26.0
              diode:
                erec_mj: 11.5
                qrr_uC: 45.0
                irrm_a: 360

      thermal:
        # Datasheet "RthJF: IGBT" and "RthJF: Diode"
        rth_jf_igbt_k_per_w: 0.10
        rth_jf_diode_k_per_w: 0.14
        notes: "RthJF depends on coolant flow; datasheet uses 50/50 water/EG reference."

    dc_link:
      voltage_class_v: 450
      capacitors:
        - type: film
          manufacturer: Panasonic
          capacitance_uF_total: 1074
          voltage_v: 450
          notes: "Leaf Gen2 smoothing film capacitor value (user target / teardown reference)."

  # ---------------------------------------------------------------------------
  # VECTRIX VX-1 / GENERIC PM300 power brick (IPM module)
  # ---------------------------------------------------------------------------
  - id: vectrix_pm300cla060
    display_name: "Vectrix / PM300CLA060 (600V 300A IPM)"
    topology: three_phase_2level_ipm
    inverter:
      switches_total: 6
      parallel_devices_per_switch: 1
      notes: "This is a 3-phase IPM (contains 6 switches + drivers/protection)."

    device:
      category: ipm_igbt_sixpack
      manufacturer: Mitsubishi
      part_number: PM300CLA060
      ratings:
        vces_max_v: 600
        ic_nominal_a: 300
        ic_peak_a: 600
        tj_range_c: [-20, 150]

      conduction:
        vce_sat:
          ic_a: 300
          # Datasheet headline + electrical characteristics limit table
          tj_points:
            - tj_c: 25
              max_v: 1.6
            - tj_c: 125
              typ_v: 1.5
        diode_vf:
          if_a: 300
          max_v: 2.2

      switching:
        times_us:
          # Datasheet gives switching times (not energies)
          conditions:
            vcc_v: 300
            ic_a: 300
            tj_c: 125
          ton_max_us: 0.5
          toff_max_us: 1.2
          trr_max_us: 1.0
        notes: >
          No Eon/Eoff table in this short datasheet; start by estimating E from times
          or use digitized CSTBT curves from a closer family part.

      thermal:
        # Datasheet gives Rth(j-c) entries (per 1/6) with labels Q/F; keep as-is as a placeholder.
        rth_jc_igbt_k_per_w_typ: 0.12
        rth_jc_igbt_k_per_w_max: 0.19
        rth_jc_diode_k_per_w_typ: 0.16
        rth_jc_diode_k_per_w_max: 0.25
        rth_cf_k_per_w_typ: 0.023
        notes: "Interpretation of Q/F labels should be confirmed against Mitsubishi appnote."

    dc_link:
      capacitors:
        - type: mlcc
          manufacturer: Murata
          part_numbers: ["7717471", "7205432"]  # user-provided markings
          capacitance_uF_each: 80
          voltage_v: 250
          count: 4
          notes: "user-provided: schematic indicates 80µF/250V each."

  # ---------------------------------------------------------------------------
  # BMW i3 placeholder (keep if you want a generic 650V module baseline)
  # ---------------------------------------------------------------------------
  - id: bmw_i3_generic650v_fs600r07a2e3_proxy
    display_name: "BMW i3 / Generic 650V IGBT module (FS600R07A2E3 proxy)"
    topology: three_phase_2level_module_placeholder
    inverter:
      switches_total: 6
      parallel_devices_per_switch: 1
      notes: "Proxy entry: replace with exact i3 module part + teardown-backed DC-link + gate-drive."

    device:
      category: igbt_module_proxy
      manufacturer: Infineon
      part_number: FS600R07A2E3
      notes: "Use FS600R07A2E3 datasheet as a starting point for curves/thermal."
